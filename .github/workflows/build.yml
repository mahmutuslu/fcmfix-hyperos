name: Build HyperOS FCMFix APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK ve Gradle Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Dosyaları Bul ve APK Derle
        run: |
          # Proje kökünü otomatik bul (settings.gradle veya build.gradle nerede ise)
          PROJ_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_DIR" ]; then
            PROJ_DIR="."
          fi
          echo "Proje dizini bulundu: $PROJ_DIR"
          cd "$PROJ_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı Çıktı Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: FCMFix-HyperOS4-Release-APK
          path: |
            **/build/outputs/apk/**/*.apk
